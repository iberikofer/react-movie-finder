<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="/react-movie-finder/favicon.svg" />
    <link rel="apple-touch-icon" href="/react-movie-finder/apple-touch-icon.png" />
    <link rel="manifest" href="/react-movie-finder/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#062c26" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Movie Finder" />
    <meta
      name="description"
      content="React Movie Finder - discover trending movies, search film titles, and check out ratings, cast, and user reviews."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap"
      rel="stylesheet"
    />
    <title>Movie Finder</title>
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>
    <script type="module" crossorigin src="/react-movie-finder/assets/index-COt-qk6B.js"></script>
    <link rel="stylesheet" crossorigin href="/react-movie-finder/assets/index-gMt72z-v.css">
  <link rel="manifest" href="/react-movie-finder/manifest.webmanifest"><script id="vite-plugin-pwa:register-sw" src="/react-movie-finder/registerSW.js"></script></head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <!-- Persistent animated iridescent gradient background (pure seamless gradient, no circles) -->
    <div id="ambient-gradient" class="ambientGradient" aria-hidden="true"></div>
    <script>
      (function () {
        var now = Date.now() / 1000;
        var r = document.documentElement;
        r.style.setProperty('--gradient-delay', '-' + (now % 28).toFixed(2) + 's');
        r.style.setProperty('--gradient-delay-2', '-' + (now % 36).toFixed(2) + 's');
      })();
    </script>
    <div id="root"></div>
  </body>
</html>
