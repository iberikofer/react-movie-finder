<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background with site yellow color (#d5d68f) -->
  <rect width="512" height="512" rx="128" fill="#d5d68f" />

  <!-- Minimalist Teal Magnifying Glass (#008080) -->
  <g>
    <!-- Handle -->
    <line
      x1="295"
      y1="295"
      x2="412"
      y2="412"
      stroke="#008080"
      stroke-width="40"
      stroke-linecap="round"
    />

    <!-- Lens Rim -->
    <circle
      cx="220"
      cy="220"
      r="105"
      fill="none"
      stroke="#008080"
      stroke-width="38"
    />

    <!-- Subtle Glare Arc -->
    <path
      d="M165 185 A 65 65 0 0 1 220 155"
      fill="none"
      stroke="#008080"
      stroke-width="12"
      stroke-linecap="round"
      opacity="0.45"
    />
  </g>
</svg>
